<!doctype html>
<html>
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Register</title>
  <link rel="stylesheet" href="./styles.css"/>
</head>
<body>
  <div class="container">
    <div class="card">
      <h1>Create account</h1>
      <p class="muted">Sign up to start creating medical notes.</p>
      <div class="spacer"></div>
      <form id="register-form" class="row">
        <input type="text" id="register-name" placeholder="Full name" />
        <input type="email" id="register-email" placeholder="Email" required />
        <input type="password" id="register-password" placeholder="Password (min 6)" minlength="6" required />
        <button type="submit">Register</button>
      </form>
      <div class="spacer"></div>
      <div class="muted">Already have an account? <a href="login.html">Login</a></div>
      <div id="register-error" class="muted"></div>
    </div>
  </div>
  <script src="./app.js"></script>
  <script>window.__IS_REGISTER__=true;</script>
</body>
</html>
